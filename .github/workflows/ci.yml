name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    # Two operating systems from the start: Phase 4 requires byte-identical builds across machines.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22                  # 22.18 or later runs TypeScript without a build step
          cache: pnpm

      - name: Install (pinned versions, lockfile must match)
        run: pnpm install --frozen-lockfile

      - name: Layer rule (no model reachable outside intent and llm)
        run: node scripts/check-layers.mjs

      - name: Grammar is well-formed and still frozen
        run: node scripts/check-grammar.mjs

      - name: Conformance corpus parses as expected; amendments are covered
        run: node scripts/check-conformance.mjs

      - name: Type check
        run: pnpm exec tsc -p tsconfig.json

      - name: Tests (scripts, every package, conformance through the real toolchain)
        run: node --test --test-force-exit "scripts/*.test.mjs" "packages/*/test/*.test.ts"

      - name: Milestone 1 demo
        shell: bash
        run: |
          node packages/cli/src/main.ts check conformance/cases/c001-calculator/input.charter
          node packages/cli/src/main.ts test conformance/cases/c001-calculator/input.charter

      - name: Package manifests match scripts/layers.mjs
        shell: bash
        run: |
          node scripts/scaffold-packages.mjs
          git diff --exit-code -- packages

      - name: Combined design document matches its parts
        shell: bash
        run: |
          node scripts/build-design-doc.mjs
          git diff --exit-code -- docs/charter-design.md
